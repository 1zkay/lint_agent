[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-alint-agent"
version = "0.1.0"
description = "ALINT-PRO LangGraph Agent Server entrypoint"
requires-python = ">=3.12,<3.13"

[tool.setuptools]
include-package-data = true
py-modules = [
  "config"
]
packages = [
  "agent_runtime",
  "alint_workflow",
  "alint_workflow.nodes",
  "app",
  "compat",
  "eda",
  "llm",
  "memory",
  "prompts",
  "rag",
  "skills",
  "langgraph_server",
  "lint_root_cause_workflow",
  "mcp_server",
  "mcp_server.tools",
  "workspace",
]

[tool.setuptools.package-data]
skills = [
  "*/SKILL.md",
  "*/references/*",
  "*/scripts/*.py",
]
